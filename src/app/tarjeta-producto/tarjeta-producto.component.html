<div class="tarjeta">
    <img
        *ngIf="!imagenConError"
        [src]="producto.images[0]"
        alt="{{ producto.title }}"
        (error)="onImageError()"
    >

    <p *ngIf="imagenConError" class="imagen-error">
        Imagen no disponible
    </p>

    <h3>{{ producto.title }}</h3>

    <p>Precio: ${{ producto.price }}</p>

    <p>Categoría: {{ producto.category.name }}</p>

    <span *ngIf="producto.stock === 0">
        Agotado
    </span>

    <button 
        type="button" 
        [disabled]="producto.stock === 0"
        (click)="agregarAlCarrito.emit(producto)"
        >
        Agregar al carrito
    </button>
</div>
