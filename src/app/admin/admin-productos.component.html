<section class="admin-productos">
  <header class="admin-productos-encabezado">
    <h2>Productos</h2>
    <a class="btn-nuevo" routerLink="nuevo">Nuevo producto</a>
  </header>

  <p *ngIf="cargando()">Cargando productos...</p>

  <p *ngIf="errorCarga()" class="error" role="alert">{{ errorCarga() }}</p>

  <table *ngIf="!cargando() && productos().length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let producto of productos(); trackBy: trackById">
        <td>{{ producto.id }}</td>
        <td>{{ producto.title }}</td>
        <td>{{ producto.category.name }}</td>
        <td>${{ producto.price }}</td>
        <td>
          <a [routerLink]="[producto.id, 'editar']">Editar</a>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando() && productos().length === 0 && !errorCarga()">
    No hay productos cargados.
  </p>
</section>
